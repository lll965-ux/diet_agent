      <rect width="156" height="36" rx="18" fill="#d9ffef" opacity=".15" stroke="#d9ffef" stroke-opacity=".30"/>
      <circle cx="21" cy="18" r="5" fill="#85e4bc"/>
      <text x="36" y="24" fill="#dcfff1" font-size="15" font-weight="700" letter-spacing="1.2">MULTI-AGENT</text>
    </g>

    <text x="0" y="114" fill="#ffffff" font-size="74" font-weight="800" letter-spacing="-2">DIET AGENT</text>
    <text x="2" y="166" fill="#c9f3e2" font-size="31" font-weight="700">一个会理解、会追问、会推荐、会避险的饮食助手</text>
    <text x="2" y="215" fill="#e7fff5" opacity=".76" font-size="20">AgentScope × Qwen × Spring Boot × MySQL</text>

    <g transform="translate(0 258)" font-size="17" font-weight="650">
      <g>
        <rect width="166" height="48" rx="24" fill="#ffffff" opacity=".11" stroke="#ffffff" stroke-opacity=".22"/>
        <circle cx="25" cy="24" r="8" fill="#77ddb4"/>
        <text x="44" y="30" fill="#f1fff9">自然语言理解</text>
      </g>
      <g transform="translate(180)">
        <rect width="146" height="48" rx="24" fill="#ffffff" opacity=".11" stroke="#ffffff" stroke-opacity=".22"/>
        <circle cx="25" cy="24" r="8" fill="#f5ce69"/>
        <text x="44" y="30" fill="#f1fff9">主动澄清</text>
      </g>
      <g transform="translate(340)">
        <rect width="146" height="48" rx="24" fill="#ffffff" opacity=".11" stroke="#ffffff" stroke-opacity=".22"/>
        <circle cx="25" cy="24" r="8" fill="#a6e87f"/>
        <text x="44" y="30" fill="#f1fff9">规则重排</text>
      </g>
      <g transform="translate(500)">
        <rect width="146" height="48" rx="24" fill="#ffffff" opacity=".11" stroke="#ffffff" stroke-opacity=".22"/>
        <circle cx="25" cy="24" r="8" fill="#ff9c86"/>
        <text x="44" y="30" fill="#f1fff9">风险守卫</text>
