    <g transform="translate(0 328)">
      <path d="M0 0H730" stroke="#d9ffef" stroke-opacity=".20"/>
      <text x="0" y="33" fill="#c9f3e2" opacity=".82" font-size="17">可控决策 · 双数据源 · 多轮状态 · 完整 Trace · 人工评估</text>
